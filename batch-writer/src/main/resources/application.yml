spring:
  application:
    name: batch-writer
  main:
    # Der batch-writer hat keine REST-Schnittstelle. Ohne Webserver
    # startet er schneller und belegt keinen Port.
    web-application-type: none
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    # reWriteBatchedInserts=true: der Postgres-Treiber macht aus vielen
    # gleichen INSERTs einer batchUpdate-Anfrage einen einzigen
    # mehrzeiligen INSERT. Genau das ist der "Bulk-INSERT" aus der Planung.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/chat?reWriteBatchedInserts=true
    username: chat
    password: ${CHAT_DB_PASSWORD:chat}

# Die beiden Stellschrauben aus PLANUNG.md, Abschnitt 3.6.
batch-writer:
  # So viele Nachrichten höchstens in einem INSERT.
  batch-size: 500
  # Kommt so lange keine neue Nachricht, wird der angefangene Stapel
  # trotzdem geschrieben. Sonst wartet eine einzelne Nachricht ewig.
  batch-timeout-milliseconds: 200

logging:
  level:
    # Im Unterricht wollen wir jeden Stapel sehen.
    ch.benedict.m321: DEBUG
