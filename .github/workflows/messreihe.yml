# Die Messreihe aus Schritt 6 auf einer Maschine von GitHub.
#
# Startet das ganze System und lässt scripts/messreihe.sh in drei Versuchen
# laufen (batch-writer skalieren, chat-service skalieren, dasselbe ohne
# DNS-Cache). Die Ergebnisse liegen danach als Artefakt "messreihe" bereit
# (Tabellen, Verläufe als CSV, docker stats). Die Zahlen gelten für DIESE
# Maschine (4 Kerne, 16 GB) — auf einem Laptop kommt etwas anderes heraus,
# und genau das ist der Punkt von offenem Punkt 7.
#
# Starten: im Reiter "Actions" → "messreihe" → "Run workflow", oder
#   gh workflow run messreihe.yml
name: messreihe

on:
  workflow_dispatch:
    inputs:
      messages_per_minute:
        description: "Zielrate (Nachrichten pro Minute)"
        default: "100000"
      duration_seconds:
        description: "Dauer der Last pro Lauf (Sekunden)"
        default: "60"
  # Läuft auch, wenn sich das Messskript selbst ändert.
  push:
    paths:
      - scripts/messreihe.sh
      - .github/workflows/messreihe.yml

jobs:
  messreihe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOAD_MESSAGES_PER_MINUTE: ${{ github.event.inputs.messages_per_minute || '100000' }}
      LOAD_DURATION_SECONDS: ${{ github.event.inputs.duration_seconds || '60' }}
    steps:
      - uses: actions/checkout@v5
      - name: .env aus den Beispielwerten
        run: cp .env.example .env
      - name: System starten
        run: |
          docker compose --profile load build
          docker compose up -d --wait --wait-timeout 300 rabbitmq postgres chat-service batch-writer
      # Versuch 1: 1, 2, 3 batch-writer — im Normalbetrieb und beim Stauabbau.
      - name: batch-writer skalieren
        env:
          CHAT_SERVICE_COUNT: "1"
          RESULT_DIR: messreihe/1-batch-writer-skalieren
        run: bash scripts/messreihe.sh
      # Versuch 2: 3 chat-service. Verteilt Docker-DNS die Last wirklich?
      - name: chat-service skalieren
        env:
          PHASES: durchsatz
          CHAT_SERVICE_COUNT: "3"
          WRITER_COUNTS: "1"
          RESULT_DIR: messreihe/2-chat-service-skalieren
        run: bash scripts/messreihe.sh
      # Versuch 3: wie 2, aber der load-generator merkt sich DNS-Antworten nicht.
      - name: chat-service skalieren ohne DNS-Cache
        env:
          PHASES: durchsatz
          CHAT_SERVICE_COUNT: "3"
          WRITER_COUNTS: "1"
          LOAD_JAVA_OPTIONS: "-Dnetworkaddress.cache.ttl=0"
          RESULT_DIR: messreihe/3-chat-service-ohne-dns-cache
        run: bash scripts/messreihe.sh
      - name: Auslastung der Container am Ende
        if: always()
        run: docker stats --no-stream | tee messreihe/docker-stats.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messreihe
          path: messreihe/
