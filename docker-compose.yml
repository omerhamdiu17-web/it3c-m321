# Baustein 1: Broker, chat-service, Datenbank, batch-writer und Keycloak.
# Das web-gateway mit dem einzigen Port kommt in einem späteren Schritt dazu.
services:

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-net

  # Die Datenbank für den Chat-Verlauf. Das Schema kommt beim ersten Start
  # aus postgres/init, aber nur bei leerem Volume (Spezifikation 4.2).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Die Daten überleben "docker compose down", erst "down -v" löscht sie.
      - chat-history:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - chat-net
    healthcheck:
      # -h localhost: erst der richtige Server zählt. Beim ersten Start läuft
      # kurz ein Hilfsserver, der nur über den Unix-Socket erreichbar ist.
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # Der EINZIGE Schreiber in die Datenbank. Holt Nachrichten stapelweise aus
  # chat.persist. Skalierbar mit "--scale batch-writer=N": alle Instanzen
  # teilen sich dieselbe Queue (Competing Consumers, PLANUNG.md 4.2).
  # Deshalb auch kein container_name: --scale braucht vergebene Namen.
  batch-writer:
    build:
      context: .
      dockerfile: batch-writer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Nur ein Sicherheitsnetz: bei Datenbank- oder Broker-Ausfall stürzt der
    # batch-writer nicht ab, sondern versucht es wieder (Spezifikation 3.3).
    restart: unless-stopped
    networks:
      - chat-net

  # Login-Dienst (spec-web-gateway.md 1.2). Importiert den Realm chat beim
  # ersten Start aus keycloak/realm-chat.json, Secret und Passwörter kommen aus
  # .env. Kein Port nach aussen: Der Browser erreicht Keycloak nur über das
  # Gateway. Kein depends_on auf postgres: Keycloak hat seine eigene Datenhaltung.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_HEALTH_ENABLED: "true"
      PUBLIC_URL: http://localhost:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET fehlt in .env}
      DEMO_PASSWORD_ALICE: ${DEMO_PASSWORD_ALICE:-alice-demo}
      DEMO_PASSWORD_BOB: ${DEMO_PASSWORD_BOB:-bob-demo}
      DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:-admin-demo}
    volumes:
      - ./keycloak/realm-chat.json:/opt/keycloak/data/import/realm-chat.json:ro
    networks:
      - chat-net
    healthcheck:
      # Im Image gibt es weder curl noch wget, aber bash: bash öffnet selbst eine
      # Verbindung zum Management-Port 9000 und prüft die Statuszeile (E2).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && read -r status <&3 && [[ \"$$status\" == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Erste Antwort in E1 nach 32 s, auf einem Runner von GitHub langsamer.
      start_period: 90s

# KEIN ports:-Eintrag in dieser Datei. Der einzige offene Port des
# Gesamtsystems gehört später dem web-gateway.
networks:
  chat-net:
    name: chat-net

volumes:
  # Eigener Name statt des üblichen "postgres-data": so wird kein gleichnamiges
  # Volume eines anderen Projekts im gleichnamigen Ordner übernommen.
  chat-history:
