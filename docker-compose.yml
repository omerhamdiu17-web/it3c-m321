# Ausbaustufe 5: Broker, Datenbank, Login-Dienst, chat-service, batch-writer,
# das web-gateway als einziger Port nach aussen und der load-generator
# (nur mit dem Profil "load").
services:

  # Der EINZIGE Container mit einem Port nach aussen. Er meldet den Benutzer
  # über Keycloak an, reicht /auth an Keycloak durch und liefert die
  # Web-Oberfläche aus. Nachrichten nimmt er per WebSocket an und reicht sie
  # per REST an den chat-service weiter (Sendeweg); zugestellte Nachrichten
  # liest er aus RabbitMQ (Zustellweg).
  web-gateway:
    build:
      context: .
      dockerfile: web-gateway/Dockerfile
    ports:
      # 127.0.0.1 davor: nur vom eigenen Rechner erreichbar, nicht aus dem LAN.
      - "127.0.0.1:8080:8080"
    environment:
      # Was der Browser sieht (das Gateway selbst) ...
      KEYCLOAK_PUBLIC_BASE_URL: http://localhost:8080
      # ... und wohin das Gateway intern spricht.
      KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Sendeweg: der Name "chat-service" wird im Docker-Netz aufgelöst.
      CHAT_SERVICE_BASE_URL: http://chat-service:8080
      # Zustellweg: das Gateway liest aus dem Fanout chat.delivery.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Queue-Tiefe für den Balken (nur admin). Die Management-API hat
      # KEINEN Port nach aussen, das Gateway fragt sie intern.
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
    depends_on:
      keycloak:
        # Keycloak hat keinen healthcheck (siehe unten). Bis es fertig
        # hochgefahren ist (ca. 30 s), antwortet /auth mit einem Fehler.
        condition: service_started
      rabbitmq:
        condition: service_healthy
      chat-service:
        condition: service_started
    networks:
      - chat-net

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      # check_port_connectivity statt ping: "ping" ist schon zufrieden, wenn
      # der Broker-Prozess läuft. Verbindungen auf Port 5672 nimmt er dann
      # aber noch nicht an, und das Gateway verbindet sich sofort beim Start.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Ein Postgres-Container mit zwei getrennten Datenbanken: "chat" für den
  # Chat-Verlauf und "keycloak" für den Login-Dienst. Jede hat einen eigenen
  # Benutzer, damit die Chat-Anwendung die Keycloak-Tabellen technisch nicht
  # lesen kann. Angelegt werden beide von den Skripten in postgres/init.
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Diese beiden liest das Init-Skript 01-create-databases.sh.
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Die Skripte laufen nur beim ERSTEN Start mit leerem Volume.
      # Zum Neu-Einspielen: docker compose down -v
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - chat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Keycloak ist der Login-Dienst (IDP). Er hat KEINEN Port nach aussen und
  # wird später vom web-gateway unter localhost:8080/auth durchgereicht
  # (PLANUNG.md, Abschnitt 3.2). Deshalb kennt er schon jetzt diese äussere
  # Adresse: der Aussteller (issuer) in jedem Token muss so lauten.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    # start-dev: Entwicklungsmodus ohne TLS-Zwang.
    # --import-realm: liest keycloak/realm-chat.json beim ersten Start ein.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Keycloak liegt unter dem Pfad /auth, nicht unter der Wurzel.
      KC_HTTP_RELATIVE_PATH: /auth
      # Die Adresse, unter der der BROWSER Keycloak später sieht. Der Pfad
      # /auth muss hier nochmals stehen: eine volle URL ersetzt den Pfad aus
      # KC_HTTP_RELATIVE_PATH, sonst fehlt /auth im Aussteller (issuer).
      KC_HOSTNAME: http://localhost:8080/auth
      # Das Gateway schickt X-Forwarded-*-Header mit; Keycloak soll sie lesen.
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-chat.json:/opt/keycloak/data/import/realm-chat.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chat-net
    # Bewusst kein healthcheck: das Image bringt kein curl mit, und ein
    # Umweg über /dev/tcp wäre ein Trick, den man nicht in zwei Sätzen
    # erklären kann. Das Gateway muss beim Start ohnehin warten können.

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Nur zum Lesen des Verlaufs; geschrieben wird vom batch-writer.
      POSTGRES_HOST: postgres
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chat-net

  # Der EINZIGE Schreiber in die Datenbank. Holt Nachrichten stapelweise
  # aus chat.persist und schreibt jeden Stapel mit einem INSERT.
  # Skalierbar mit "--scale batch-writer=N": alle Instanzen teilen sich
  # dieselbe Queue (Competing Consumers, PLANUNG.md Abschnitt 4.2).
  batch-writer:
    build:
      context: .
      dockerfile: batch-writer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      POSTGRES_HOST: postgres
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chat-net

  # Erzeugt Last: schickt Nachrichten direkt an den chat-service, nicht über
  # das Gateway. Läuft NUR mit dem Profil "load", also nicht bei einem
  # normalen "docker compose up":
  #   docker compose --profile load up load-generator
  # Nach der eingestellten Dauer beendet sich der Container von selbst.
  load-generator:
    build:
      context: .
      dockerfile: load-generator/Dockerfile
    profiles: ["load"]
    environment:
      CHAT_SERVICE_BASE_URL: http://chat-service:8080
      LOAD_MESSAGES_PER_MINUTE: ${LOAD_MESSAGES_PER_MINUTE:-100000}
      LOAD_DURATION_SECONDS: ${LOAD_DURATION_SECONDS:-60}
      # Für Versuche mit der JVM, z.B. den DNS-Cache ausschalten:
      # LOAD_JAVA_OPTIONS="-Dnetworkaddress.cache.ttl=0" (siehe docs/messreihe.md)
      JAVA_TOOL_OPTIONS: ${LOAD_JAVA_OPTIONS:-}
    depends_on:
      chat-service:
        condition: service_started
    networks:
      - chat-net

# Genau EIN ports:-Eintrag in dieser Datei, und der gehört dem web-gateway.
# Kein anderer Dienst bekommt einen.
networks:
  chat-net:
    name: chat-net

# Die Datenbank-Dateien überleben "docker compose down".
# Erst "docker compose down -v" löscht sie (und löst damit die Init-Skripte
# und den Realm-Import beim nächsten Start erneut aus).
volumes:
  postgres-data:
