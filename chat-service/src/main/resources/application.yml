spring:
  application:
    name: chat-service
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    # Nur zum LESEN des Verlaufs. Die Verbindung wird erst bei der ersten
    # Abfrage aufgebaut, der Dienst startet also auch ohne Datenbank.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/chat
    username: chat
    password: ${CHAT_DB_PASSWORD:chat}

server:
  port: 8080

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
