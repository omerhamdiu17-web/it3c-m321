spring:
  application:
    name: chat-service
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Alle 10 s ein Lebenszeichen zwischen Instanz und Broker. Hängt die
    # Instanz (S6), merkt RabbitMQ es nach etwa 20 s, trennt die Verbindung
    # und löscht ihre eigene Queue. Die Vorgabe wären 60 s.
    requested-heartbeat: 10s

server:
  port: 8080
  # Beim Stoppen offene SSE-Verbindungen sofort schliessen. Spring Boot würde
  # sonst bis zu 30 s warten, bis sie von selbst enden, und das tun sie nie.
  # Die Clients verbinden sich neu und holen mit Last-Event-ID nach.
  shutdown: immediate

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
